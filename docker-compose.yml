# Run the whole app — PHP 8.1 + Apache + MySQL 8 — with one command:
#
#   1. copy .env.production.example .env.docker
#   2. put a generated APP_KEY in .env.docker  (php artisan key:generate --show)
#   3. docker compose up --build
#   4. open http://localhost:8080
#
# This is the same image that gets deployed to Railway/Render.

services:
    app:
        build: .
        ports:
            - "8080:80"
        env_file:
            - .env.docker
        depends_on:
            db:
                condition: service_healthy
        volumes:
            # Uploaded donation photos survive container rebuilds.
            - uploads:/var/www/html/storage/app/public

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: customyzables
            MYSQL_USER: customyzables
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - dbdata:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            interval: 5s
            timeout: 3s
            retries: 20

volumes:
    dbdata:
    uploads:
